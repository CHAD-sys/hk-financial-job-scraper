[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hk-job-scraper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # In-memory Redis for testing webapp/backend/rate_limit.py's
    # RedisRateLimiter without a real Redis server. The [lua] extra pulls in
    # lupa, needed for fakeredis to execute the sliding-window Lua script the
    # same way a real Redis server would (EVAL/EVALSHA) rather than failing
    # with "unknown command".
    "fakeredis[lua]>=2.37",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hk_jobs*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
