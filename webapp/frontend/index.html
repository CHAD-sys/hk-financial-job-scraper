<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A curated, AI-supported index of Hong Kong financial-sector jobs across leading institutions." />
    <title>FinEx Careers — HK Financial Jobs</title>

    <!-- Font loading moved here from a CSS @import (index.css), which is
         render-blocking: the browser had to download+parse the stylesheet,
         discover the import, then fetch the font before it could paint any
         text. preconnect opens the connection early; the stylesheet link
         then loads in parallel with everything else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
