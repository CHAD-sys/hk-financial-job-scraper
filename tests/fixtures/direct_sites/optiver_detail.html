erverOnlyRender":false,"clientOnlyRender":false,"metadata":[{"label":"Level","value":"Internship","isTime":false,"componentID":0},{"label":"Location","value":"Singapore","isTime":false,"componentID":0},{"label":"Department","value":"Risk, Finance \u0026 Legal","isTime":false,"componentID":0}],"variant":"rail","cta":{"label":"Apply","href":"/join-us/jobs/risk-finance-and-legal/singapore/market-risk-internship-2027-singapore/apply","target":"","componentID":0,"culture":"en"},"isRegistrationClosed":false,"signupDeadline":"","timezone":"","eventDate":"","signupModalEmbedUrl":"","jobApplyTracking":{"vacancyName":"Market Risk Internship 2027 - Singapore","vacancyOffice":"singapore","vacancyDomain":"risk-finance-and-legal","vacancyLevel":"internship"},"componentID":0}));ReactDOM.hydrateRoot(document.getElementById("react_0HNPKGHIE02N1"), React.createElement(Components.RichText,{"reactComponentName":"Components.RichText","serverOnlyRender":false,"clientOnlyRender":false,"opticode":false,"layout":"contained","text":"\u003Cp\u003E\u0026nbsp;\u003C/p\u003E\n\u003Cp\u003EReady to accelerate your growth in one of the most fascinating and dynamic industries?\u003C/p\u003E\n\u003Cp\u003EOur\u003Cstrong\u003E Market Risk Summer Internship program\u003C/strong\u003E is the perfect opportunity for you to explore the critical role that risk management plays in the world of market making.\u003C/p\u003E\n\u003Cp\u003EKickstart your learning in our global offices, alongside your peers. You\u0027ll have the exclusive opportunity to commence your training in a different office like Sydney, Shanghai or Amsterdam, before returning to Singapore to put your knowledge into practice.\u003C/p\u003E\n\u003Cp\u003EDiscover what goes on behind the scenes to ensure our trading operations run safely within our risk limits. With guidance from your mentor and team, you\u0027ll collaborate on projects that solve Optiver\u2019s real-world challenges. Plus, if you\u2019ve excelled over the summer, you could receive an offer to return as a Graduate Market Risk Analyst.\u003C/p\u003E\n\u003Cp\u003EWith Optiver\u2019s internship program, your work improving the market starts today. Apply now.\u003C/p\u003E\n\u003Cp\u003E\u003Cspan style=\u0022text-decoration: underline;\u0022\u003E\u003Cstrong\u003EWho we are\u003C/strong\u003E\u003C/span\u003E\u003C/p\u003E\n\u003Cp\u003EOptiver is a global tech-driven trading firm, with offices in Amsterdam, Sydney, London, Singapore, Shanghai, Mumbai, Hong Kong, Taipei, Chicago and Austin. Founded in 1986, today we are a leading liquidity provider, with close to 2,000 employees in offices around the world, united in our commitment to improve the market through competitive pricing, execution and risk management.\u003C/p\u003E\n\u003Cp\u003EBy providing liquidity on multiple exchanges across the world in various financial instruments we participate in the safeguarding of healthy and efficient markets. We provide liquidity to financial markets using our own capital, at our own risk, trading a wide range of products: listed derivatives, cash equities, ETFs, bonds and foreign currencies.\u003Cbr /\u003E\u003Cbr /\u003E\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003ENo previous experience in trading or financial markets? \u003C/strong\u003E\u003C/p\u003E\n\u003Cp\u003EYou bring the passion and we\u0027ll have the training to support you along the way.\u003C/p\u003E\n\u003Cp\u003EYou\u0027ll be immersed in our industry-leading training program, where you\u0027ll learn extensive trading principles and concepts. Once you\u2019ve got the basics covered, you\u2019ll put your knowledge into practice and work on a risk specific project. Our experienced risk analysts will mentor and guide you through the process. By the end of the internship, you\u2019ll have a solid theoretical and practical understanding of life as a Market Risk Analyst.\u003C/p\u003E\n\u003Cp\u003E\u003Ca href=\u0022https://optiver.com/working-at-optiver/career-hub/tim-risk-graduate-story/\u0022\u003ERead Tim\u2019s \u2018Day in the Life\u2019 story to learn more\u003C/a\u003E.\u003C/p\u003E\n\u003Cp\u003E\u003Cspan style=\u0022text-decoration: underline;\u0022\u003E\u003Cstrong\u003EWho you are\u003C/strong\u003E\u003C/span\u003E\u003C/p\u003E\n\u003Cp\u003EYou have a keen interest in financial markets, and are equipped with a strong set of analytical and problem-solving skills. Coupled with a natural curiosity, you\u0027re proactive by nature and can work autonomously. In addition, you:\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EAre an adept communicator\u003C/li\u003E\n\u003Cli\u003EHave good planning and organisational skills, with strong attention to detail\u003C/li\u003E\n\u003Cli\u003EEnjoy working in a collaborative environment\u003C/li\u003E\n\u003Cli\u003EHave a practical mindset, with the ability to remain calm in a crisis\u003C/li\u003E\n\u003Cli\u003EHave experience with coding (VBA, Python, Matlab or other) would be a plus\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u003Cspan style=\u0022text-decoration: underline;\u0022\u003E\u003Cstrong\u003EWhat you\u2019ll get\u003C/strong\u003E\u003C/span\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe chance to work alongside diverse and intelligent peers in a rewarding environment\u003C/li\u003E\n\u003Cli\u003EWe offer competitive remuneration, including an attractive bonus structure and additional leave entitlements\u003C/li\u003E\n\u003Cli\u003ECorporate health insurance\u003C/li\u003E\n\u003Cli\u003ETraining, mentorship and personal development opportunities\u003C/li\u003E\n\u003Cli\u003EWeekly in-house chair massages\u003C/li\u003E\n\u003Cli\u003EDaily breakfast and lunch\u003C/li\u003E\n\u003Cli\u003ERegular social events\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EAs an intentionally flat organisation, we believe that great ideas and impact can come from everyone. We are passionate about empowering individuals and creating diverse teams that thrive. Every person at Optiver should feel included, valued and respected, because we believe our best work is done together.\u003C/p\u003E\n\u003Cp\u003EOur commitment to diversity and inclusion is hardwired through every stage of our hiring process. We encourage applications from candidates from any and all backgrounds, and we welcome requests for reasonable adjustments during the process to ensure that you can best demonstrate your abilities.\u003C/p\u003E\n\u003Cp\u003E\u003Cspan style=\u0022text-decoration: underline;\u0022\u003E\u003Cstrong\u003EEligibility\u003C/strong\u003E\u003C/span\u003E\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003EApplicants must have working rights in Singapore and not require employment sponsorship.\u003C/li\u003E\n\u003Cli\u003EUniversity student graduating in 2027 or later\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003E\u0026nbsp;\u003C/p\u003E","componentID":0,"culture":"en"}));ReactDOM.hydrateRoot(document.getElementById("react_0HNPKGHIE00LU"), React.createElement(Components.SkipLinks,{"reactComponentName":"Components.SkipLinks","serverOnlyRender":false,"clientOnlyRender":false,"label":"Skip links","links":[{"href":"#menu","label":"Skip to menu"},{"href":"#site-search","label":"Skip to search"},{"href":"#below-header","label":"Skip to main content"},{"href":"#footer","label":"Skip to footer"}]}));ReactDOM.hydrateRoot(document.getElementById("react_0HNPKGHIE010R"), React.createElement(Components.Footer,{"reactComponentName":"Components.Footer","serverOnlyRender":false,"clientOnlyRender":false,"hasPreFooter":false,"description":"At Optiver, we continuously quote buy and sell prices across financial markets, using our own capital and advanced technology to provide liquidity at scale across products, venues and market conditions.","aboutLink":{"label":"More about Optiver","href":"/about-us/","target":"_self","componentID":0,"culture":"en"},"socialLinks":[{"platform":"instagram","href":"https://www.instagram.com/optiverglobal"},{"platform":"x","href":"https://
