<!doctype html><html><head><script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"","value":"364000"},"hiringOrganization":{"@type":"Organization","name":"","sameAs":"https://careers.qbe.com/gb/en","logo":"https://assets.phenompeople.com/CareerConnectResources/prod/QICQIMGB/images/job_logo_config--1770113330701.png","url":"https://careers.qbe.com/gb/en/job/QICQIMGB364000EXTERNALENGB/Specialist-Underwriting-Governance"},"jobLocation":{"address":{"addressCountry":"Hong Kong","@type":"PostalAddress","postalCode":"","addressLocality":"Quarry Bay","addressRegion":""},"@type":"Place"},"employmentType":"Full time","@type":"JobPosting","workHours":"40 hours per week","description":"&lt;h1&gt;&lt;/h1&gt;&lt;h1&gt;&lt;b&gt;Primary Details&lt;/b&gt;&lt;/h1&gt;Time Type: Full time&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;Worker Type: Employee&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;The purpose of this role is to ensure the implementation of underwriting policies in compliance with Group standards, collaborate with various departments to develop portfolio reporting, and identify and escalate issues for necessary actions in a timely manner.&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;h2&gt;&lt;b&gt;The opportunity&lt;/b&gt;&lt;/h2&gt;&lt;br /&gt;&lt;ul&gt;&lt;li&gt;Play a key role in strengthening underwriting governance across Hong Kong and Macau, helping to ensure consistent standards, sound controls and regulatory compliance.&lt;/li&gt;&lt;li&gt;Work closely with local and regional stakeholders to support delegated authority, peer reviews, risk assessments and continuous improvement initiatives.&lt;/li&gt;&lt;li&gt;Build your expertise in a collaborative regional environment where your work will directly contribute to a strong and effective underwriting community.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;About QBE&lt;/b&gt;&lt;/p&gt;&lt;p&gt;At QBE, we get to the heart of what matters for our customers. And we do it all with a human touch.  &lt;/p&gt;&lt;p&gt;We’re an international insurer with more than 13,000 people working across 26 countries – which means we’re big enough for your ambitions, yet small enough for you to make a real impact. It’s an exciting time. We’re building momentum towards our vision to become the most consistent and innovative risk partner.&lt;/p&gt;&lt;p&gt;What if you could have a positive impact – at work and in the world? As part of the QBE team, you’ll get to spend every day working with people who are passionate, talented and kind.&lt;/p&gt;&lt;br /&gt;&lt;h2&gt;&lt;b&gt;Your new role &lt;/b&gt;&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Implementation of consistent underwriting policies, procedures and practices in HK and Macau in compliance with the Group, Regional and local UW Standards&lt;/li&gt;&lt;li&gt;Provide necessary communication on UW governance to all stakeholders to support compliance to governance standard&lt;/li&gt;&lt;li&gt;Administration of Delegated Authority framework for Underwriting n HK and Macau including system sanctions&lt;/li&gt;&lt;li&gt;Administration of Peer Review process on Underwriting in HK &amp; Macau&lt;/li&gt;&lt;li&gt;Assist Regional governance team on Delegated Underwriting Authority management.&lt;br /&gt;Monitor compliance with underwriting guidelines and standards and undertake regular reviews&lt;/li&gt;&lt;li&gt;Assist and facilitate the process for the annual risk assessment exercise with the underwriting team.&lt;/li&gt;&lt;li&gt;Collaborate with Regional governance team on ad-hoc improvement projects to strengthen the governance standard in the underwriting community.&lt;/li&gt;&lt;li&gt;Assist in periodic declaration and attestation on the topic of Underwriting Governance&lt;/li&gt;&lt;li&gt;Provide clarification to the wider community on the topic of Underwriting Governance&lt;/li&gt;&lt;li&gt;Ensure peer reviews completed timely as per Asia guidelines and appropriate actions taken on identified gaps and improvements.&lt;/li&gt;&lt;li&gt;Ensure local DUAs are reported to the Regional team in compliance with Asia DUA guidelines&lt;br /&gt;Internal and External Audit findings on Underwriting Governance (i.e. compliance to standard, number of breaches, risk assessment) are generally satisfactory&lt;/li&gt;&lt;li&gt;Ensure local UW guidelines in place, regularly reviewed, up to date, communicated and cascaded&lt;/li&gt;&lt;/ul&gt;&lt;br /&gt;&lt;h2&gt;&lt;b&gt;About you&lt;/b&gt;&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;Provide necessary training on underwriting (UW) governance to all stakeholders to ensure compliance.&lt;/li&gt;&lt;li&gt;Administration of Delegated Authority (DUA) framework for Underwriting, including central management of DUA agreements.&lt;/li&gt;&lt;li&gt;Monitor compliance with underwriting guidelines and standards, conducting regular reviews.&lt;/li&gt;&lt;li&gt;Support the development of business plans, strategy, and budgets in collaboration with Product Leaders.&lt;/li&gt;&lt;li&gt;Collaborate with the Catastrophe Modelling team to monitor, assess, and manage exposures effectively.&lt;/li&gt;&lt;li&gt;Ensure timely completion of peer reviews and take appropriate actions on identified gaps and improvements.&lt;/li&gt;&lt;li&gt;Maintain local UW guidelines, conduct regular reviews, and ensure they are up to date and cascaded appropriately.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;b&gt; &lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Benefits&lt;/b&gt;&lt;/p&gt;&lt;p&gt;We offer a range of benefits to help provide holistic support for your work life, whatever your circumstances. As a QBE employee you will have access to and benefit from:&lt;/p&gt;&lt;p&gt;·       ‘Hybrid Working’ – a mix of working from home and in the office to enhance your work/life balance&lt;/p&gt;&lt;p&gt;·       Life Leave, supporting the life events we all experience, leaving your annual leave for rest&lt;/p&gt;&lt;p&gt;·       Free holistic wellbeing coaching, nutritional, confidential counselling, financial and legal advice&lt;/p&gt;&lt;p&gt;&lt;b&gt; &lt;/b&gt;&lt;/p&gt;&lt;p&gt;&lt;b&gt;Awards &amp; Recognition&lt;/b&gt;&lt;/p&gt;&lt;p&gt;We value our employee’s experience with us and are proud to have been recognised for the following awards:&lt;/p&gt;&lt;p&gt;·       Qorus Reinvention Awards APAC 2025: Gold winner in the ESG category&lt;/p&gt;&lt;p&gt;·       Digital Insurance Awards APAC: Digital Insurance - Insurer Leader 2025&lt;/p&gt;&lt;p&gt;·       HKB Technology Excellence Awards: Automation - Insurance&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;b&gt;How to Apply&lt;/b&gt;&lt;/p&gt;&lt;p&gt;If you’re looking for a career that combines your expertise and your empathy, click Apply today.&lt;/p&gt;&lt;p&gt; Your career. At the heart of it. &lt;/p&gt;&lt;br /&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;br /&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;&lt;b&gt;Skills:&lt;/b&gt;&lt;/p&gt;Administration Management, Analytical Thinking, Business Reporting, Communication, Critical Thinking, Customer Service, Financial Products, Insurance Underwriting, Intentional collaboration, Managing performance, Policy Analysis, Regulatory Compliance, Risk Management, Sourcing Analytics, Stakeholder Management&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;How to Apply:&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;To submit your application, click &#34;Apply&#34; and follow the step by step process.&lt;/p&gt;&lt;p style=\"text-align:inherit\"&gt;&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;Equal Employment Opportunity:&lt;/p&gt;&lt;p style=\"text-align:left\"&gt;QBE is an equal opportunity employer and is required to comply with equal employment opportunity legislation in each jurisdiction it operates.&lt;/p&gt;","title":"Specialist Underwriting Governance","datePosted":"2026-10-28T00:00:00.000+0000","@context":"http://schema.org","occupationalCategory":"Underwriting","directApply":false}</script></head><body></body></html>
