t managers with expertise and specialization on all aspects of product risk management. Product managers remain responsible for risk in their product, and product executives retain responsibility for their governance routines</p><p> </p><p><b>Job Description:</b></p><p>Responsible for driving risk deliverables across the GPS Product organization, with a keen focus on the 12 countries across APAC.</p><p>This role executes risk activities with GPS Product Managers and key stakeholders to translate enterprise risk requirements into actionable Product deliverables and drive execution through completion. The individual will proactively manage assigned deliverables, identify gaps and dependencies, coordinate across stakeholders, and escalate execution risks and barriers as appropriate.</p><p> </p><p><b>Key Responsibilities:</b></p><p><b> </b></p><p>Enable execution of risk management across GPS APAC. Ensure high quality of product risk governance across Issues Management, Single Process Inventory (SPI), Audit Management, Targeted Risk Assessments, Third Party, Law Rule Reg &amp; Clearing Rule Management, and Product Risk Assessment (PRA) processes.</p><ul><li>Engage and influence across various control partners such as Business Controls, COO, Global Banking Risk, Global Financial Crimes Compliance (GFC), Global Compliance and Operational Risk (GCOR), and other key stakeholders such as Operations &amp; Technology on GPS risk matters</li></ul><ul><li>Manage regular routines with Product Managers &amp; other partners to identify and review current open issues, watch items, upcoming regulations &amp; new product initiatives pipeline.        </li></ul><ul><li>Drive and QA development of Product Intake assessments, Product Risk Assessments (PRAs), Single Process Inventories (SPIs), Issue documentation, action plans, closure documentation and other Risk deliverables based on inputs from Product Managers and in line with the enterprise expectations</li></ul><ul><li>Lead SPI owners on risk &amp; controls assessment including identifying processes, and providing advisory on creation and updates of SPIs.</li></ul><ul><li>Lead, when needed, on regulatory change management, timely assessments, past due items and escalations in alignment with the regulatory change management process.  Escalate issues or conflicts in legal and regulatory requirements as appropriate.</li></ul><ul><li>Advise Product Managers, when needed, on responding to audit’s questions and requests for information, Targeted Risk Assessments (TRAs) from 2nd line (GCOR / GFC etc) or regulatory engagements (questions, consultations, inspections, and exams).</li></ul><ul><li>Monitor key risk indicators across GPS products, including key control metrics, operational losses, client related complaints, and issues management (Self-Identified Issues, Risk-Identified Issues, Control Enhancements)</li></ul><p><b> </b></p><p><b>Required Skills:</b></p><ul><li>3&#43; years of experience in Process Design, Business Controls, Risk Management, Product Risk, or related risk functions.</li><li>Strong analytical, organizational, and problem-solving skills with demonstrated attention to detail.</li><li>Ability to quickly learn complex products, processes, and risk requirements and independently drive assigned deliverables through completion.</li><li>Demonstrated ability to manage multiple priorities, stakeholders, dependencies, and deadlines while adapting to changing business priorities.</li><li>Strong written, verbal, and presentation skills, with the ability to clearly communicate requirements, issues, risks, and required actions.</li><li>Demonstrated ability to connect the dots across organizational silos, think outside the box, and apply an enterprise mindset.</li><li>Ability to proactively identify, resolve, or appropriately escalate issues and barriers to maintain execution timelines.</li><li>Proficiency with Microsoft Office products, including Excel, PowerPoint, Word, and Visio.</li></ul><
