<html><head>
<script type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","baseSalary":{"@type":"MonetaryAmount","currency":"","value":{"@type":"QuantitativeValue","unitText":""}},"datePosted":"2026-08-18","description":"<p>At Barclays, we don’t just adapt to the future – we shape it. Join us as a <b><span>Liquid Financing – VP Full Stack Developer</span></b> where you will help engineer the next generation of our global Stock Borrow &amp; Lending (SBL) and Secured Finance technology platform. Magics is the strategic front‑to‑back platform supporting <b><span>Liquid</span><span> Finance, SBL, and Equity Repo</span></b><span> </span> workflows across APAC, EMEA, and AMER—spanning trade capture, lifecycle management, inventory management, settlements. Based in <b>Hong Kong</b>, this role places you directly alongside <b>Front Office SBL team</b>, requiring exceptional domain fluency, rapid decision‑making, and the ability to translate market needs into robust engineering solutions. You will deliver resilient, modern, microservices‑aligned components across <b>Java Spring</b>, <b>SQL</b>, <b>Angular</b>, and <b>OpenShift</b>—driving modernization of a business‑critical platform used globally.</p><p><b>This is a hands‑on engineering role </b>for someone who thrives in front‑office – fast paced environments and brings deep SBL knowledge combined with strong engineering discipline.</p><p></p><p><b>Key responsibilities:</b></p><ul><li>Design, build, test, and deploy high‑quality ePrime application components spanning UI (Angular), services (Java Spring), and database (SQL).</li><li>Modernize legacy components into scalable, containerized microservices deployed on<b> </b>OpenShift.</li><li>Deliver front‑to‑back solutions across business, regulatory, and control requirements, ensuring security, stability, capacity, and maintainability.  </li><li>Implement strong engineering discipline: code reviews, test automation (TDD), CI/CD, and observability best practices.</li><li>Work directly with SBL traders, Middle office, convert trading desk needs into technical designs and production‑ready solutions with minimal turnaround and support intraday trading operations through incident triage, rapid tactical fixes, and robust strategic enhancements.</li><li>Contribute to the architectural direction of Magics, influencing modernization strategy and ecosystem integration.</li><li>Manage relationships with upstream/downstream systems, vendor gateways, and internal control functions.</li><li>Ensure strong production readiness across monitoring, alerting, data integrity, and operational resilience.</li></ul><p></p><p><b>Essential Skills/Basic Qualifications:</b></p><ul><li>Experience in full‑Stack Engineering <b> - </b>Backend: Java, Spring Boot, REST microservices ,Frontend: Angular, HTML/CSS/TypeScript,</li><li>Experience in Database: SQL (Oracle/MS SQL) and advanced query optimization ,Cloud‑native delivery: OpenShift, containers, Linux and Git</li><li>Strong understanding of OO design principles and ability to refactor complex systems with experience working in Agile/Scrum with test‑driven development.</li><li>Deep SBL / Equity Finance experience, including borrowing/lending workflows, recalls, returns, marks, collateral, booking flows, lifecycle events, and vendor gateway interactions.</li><li>Working knowledge of broader Capital Markets and Front Office trading processes.</li><li>Ability to operate in high‑pressure environments with traders and senior stakeholders.</li><li>Strong analytical &amp; problem‑solving skills; ability to quickly diagnose production issues and deliver tactical &#43; strategic fixes.</li><li>Excellent communication—comfortable explaining technology to business and vice‑versa.</li></ul><p></p><p><b>Desirable skills/Preferred Qualifications:</b></p><ul><li>Experience with event‑driven architectures, caching patterns, messaging (Kafka/Solace).</li><li>Exposure to workflow automation, inventory optimization, or funding optimization models.</li><li>Experience with DevOps, containers, observability tooling, and scalable distributed systems.</li><li>Knowledge of Prime Financing ecosystem.</li></ul><p></p><p>You may be assessed on critical success capabilities such as Front Office partnership and stakeholder management, Digital &amp; Technology skills (full stack, microservices, cloud, DevOps),Business understanding of SBL and Secured Finance, Change execution and delivery discipline, Risk &amp; Controls awareness and compliance with the Enterprise Risk Management Framework</p><p></p><p>Barclays is required by law to confirm that you have the Legal Right to Work in any role that you apply for. If you currently hold a work visa sponsored by Barclays, or you would require sponsorship from Barclays, you must declare this as part of your application. Sponsored visas are role and entity specific, and any changes must be reviewed. It is important that you ensure you are working on the correct visa at all times. Failure to accurately disclose your visa status or Legal Right to Work may result in your application or any employment offer being withdrawn at any time.</p> <p><b>Purpose of the role</b></p><p>To design, develop and improve software, utilising various engineering methodologies, that provides business, platform, and technology capabilities for our customers and colleagues. </p><p></p><p><b>Accountabilities</b></p><ul><li>Development and delivery of high-quality software solutions by using industry aligned programming languages, frameworks, and tools. Ensuring that code is scalable, maintainable, and optimized for performance.</li><li>Cross-functional collaboration with product managers, designers, and other engineers to define software requirements, devise solution strategies, and ensure seamless integration and alignment with business objectives.</li><li>Collaboration with peers, participate in code reviews, and promote a culture of code quality and knowledge sharing.</li><li>Stay informed of industry technology trends and innovations and actively contribute to the organization’s technology communities to foster a culture of technical excellence and growth.</li><li>Adherence to secure coding practices to mitigate vulnerabilities, protect sensitive data, and ensure secure software solutions.</li><li>Implementation of effective unit testing practices to ensure proper code design, readability, and reliability.</li></ul><p></p><p><b>Vice President Expectations</b></p><ul><li>To contribute or set strategy, drive requirements and make recommendations for change. Plan resources, budgets, and policies; manage and maintain policies/ processes; deliver continuous improvements and escalate breaches of policies/procedures..</li><li>If managing a team, they define jobs and responsibilities, planning for the department’s future needs and operations, counselling employees on performance and contributing to employee pay decisions/changes. They may also lead a number of specialists to influence the operations of a department, in alignment with strategic as well as tactical priorities, while balancing short and long term goals and ensuring that budgets and schedules meet corporate requirements..</li><li>If the position has leadership responsibilities, People Leaders are expected to demonstrate a clear set of leadership behaviours to create an environment for colleagues to thrive and deliver to a consistently excellent standard. The four LEAD behaviours are: L – Listen and be authentic, E – Energise and inspire, A – Align across the enterprise, D – Develop others..</li><li>OR for an individual contributor, they will be a subject matter expert within own discipline and will guide technical direction.  They will lead collaborative, multi-year assignments and guide team members through structured assignments, identify the need for the inclusion of other areas of specialisation to complete assignments. They will train, guide and coach less experienced specialists and provide information affecting long term profits, organisational risks and strategic decisions..</li><li>Advise key stakeholders, including functional leadership teams and senior management on functional and cross functional areas of impact and alignment.</li><li>Manage and mitigate risks through assessment, in support of the control and governance agenda.</li><li>Demonstrate leadership and accountability for managing risk and strengthening controls in relation to the work your team does.</li><li>Demonstrate comprehensive understanding of the organisation functions to contribute to achieving the goals of the business.</li><li>Collaborate with other areas of work, for business aligned support areas to keep up to speed with business activity and the business strategies.</li><li>Create solutions based on sophisticated analytical thought comparing and selecting complex alternatives. In-depth analysis with interpretative thinking will be required to define problems and develop innovative solutions.</li><li>Adopt and include the outcomes of extensive research in problem solving processes.</li><li>Seek out, build and maintain trusting relationships and partnerships with internal and external stakeholders in order to accomplish key business objectives, using influencing and negotiating skills to achieve outcomes.</li></ul><p></p><p>All colleagues will be expected to demonstrate the Barclays Values of Respect, Integrity, Service, Excellence and Stewardship – our moral compass, helping us do what we believe is right. They will also be expected to demonstrate the Barclays Mindset – to Empower, Challenge and Drive – the operating manual for how we behave.</p>","employmentType":"Permanent","identifier":{"@type":"PropertyValue","name":"Job ID","value":"JR-0000106914"},"industry":"Markets Pre Trade","title":"Liquid Financing – VP Full Stack Developer","url":"https://search.jobs.barclays/job/hong-kong/liquid-financing-vp-full-stack-developer/13015/99388015584","workHours":"Full time","directApply":false,"hiringOrganization":{"@type":"Organization","name":"Barclays","logo":"https://tbcdn.talentbrew.com/company/13015/v1_0/img/logo/Barclays-Logo-stacked-RGB-Cyan.jpg"},"jobLocation":[{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Hong Kong","addressRegion":"","addressCountry":"Hong Kong","streetAddress":"2 Queens Road, Central","postalCode":""}}]}</script>
