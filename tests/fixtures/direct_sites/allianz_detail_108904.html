<!doctype html><html><head><script type="application/ld+json">{"identifier":{"@type":"PropertyValue","name":"Allianz Insurance","value":"108904"},"hiringOrganization":{"@type":"Organization","name":"Allianz Insurance","sameAs":"https://careers.allianz.com/global/en","url":"https://careers.allianz.com/global/en/job/108904/Data-Product-Owner-f-m-d-Vendor-Market-Data","logo":null},"jobLocation":[{"geo":{"@type":"GeoCoordinates","latitude":"50.12696","longitude":"8.66796"},"address":{"@type":"PostalAddress","postalCode":"60323","addressCountry":"Germany","addressLocality":"Frankfurt","addressRegion":""},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"22.27832","longitude":"114.17469"},"address":{"@type":"PostalAddress","postalCode":"","addressCountry":"Hong Kong, China","addressLocality":"","addressRegion":""},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"48.14646","longitude":"11.56009"},"address":{"@type":"PostalAddress","postalCode":"80335","addressCountry":"Germany","addressLocality":"München","addressRegion":""},"@type":"Place"},{"geo":{"@type":"GeoCoordinates","latitude":"1.36667","longitude":"103.8"},"address":{"@type":"PostalAddress","postalCode":"18961","addressCountry":"Singapore","addressLocality":"Singapore","addressRegion":""},"@type":"Place"}],"employmentType":["FULL_TIME"],"@type":"JobPosting","workHours":"40 hours per week","description":"&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;The Investment Data Area (IDA) is AllianzGI’s home for investment-management-related data products. Today IDA owns ten established data products (incl. Positions &amp; Transactions, Issuer &amp; Security Information, Benchmark &amp; Market Index Data, Investment Key Figures, and Performance &amp; Attribution, among others), which share dependencies and largely leverage IDS, AllianzGI’s strategic partner for investment data services. Vendor Market Data (VMD) will be IDA’s eleventh data product.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;As the Data Product Owner (f/m/d) for Vendor Market Data, you will report to the Investment Data Area Business Lead and be responsible for delivering AI-ready, quality-assessed, lineage-tracked vendor and research data to business stakeholders. To reach your goals, you will be supported by your Squad, part of AllianzGI’s Investment Data Area Tech, and work alongside Data Stewards, Business / Data Analysts and Engineers within the Squad. In this role, you serve as the functional lead, responsible for driving the Squad’s work through a clear Product Vision and Strategy.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Your mission is to grow VMD from its current scope into the single governed raw-data layer for all vendor and research data consumed by investment teams and beyond – owning ingestion (native, API, SFTP), data quality, access management, lineage and cataloguing in Unity Catalog, while consuming teams build their own models and analytics on top. You will manage the Squad’s Backlog, set priorities across onboarding waves, and define requirements to ensure alignment with strategic objectives. Balancing business and technical priorities, you will guide the Squad to deliver data solutions that meet organizational goals, focusing on maximizing customer value through effective product management.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;This position will be based in Frankfurt, Munich, Hong Kong or Singapore.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;What you will do&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Product Ownership &amp; Agile Delivery&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Define and communicate the vision, mission, and roadmap for the Vendor Market Data Product.&lt;/li&gt;&lt;li&gt;Own and manage the product backlog in JIRA, translating documented data demands from Risklab, Equity, Fixed Income, Multi Asset, and Investment Research into actionable epics and user stories.&lt;/li&gt;&lt;li&gt;Lead backlog grooming, sprint planning, and review ceremonies in collaboration with the Agile Master.&lt;/li&gt;&lt;li&gt;Prioritize onboarding of vendors and datasets (native delta-sharing, API, SFTP) according to business value and squad capacity.&lt;/li&gt;&lt;li&gt;Develop and own the global VMD operating model, data domains and ingestion patterns, ensuring every dataset is catalogued and lineage-tracked in Unity Catalog.&lt;/li&gt;&lt;li&gt;Manage the research and resolution of data discrepancies and quality issues, involving appropriate resources within the squad.&lt;/li&gt;&lt;li&gt;Collaborate with Market Data Services (MDS) on license management and ensure appropriate data access management.&lt;/li&gt;&lt;li&gt;Identify and drive migration of existing, duplicated data flows into the governed VMD platform.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;Stakeholder Engagement&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Act as the primary liaison between consuming Investment stakeholders, investment tech products and the VMD Squad, ensuring raw data ownership stays with IDA while consuming teams refine their own models and analytics on top.&lt;/li&gt;&lt;li&gt;Facilitate requirement-gathering workshops with investment teams and beyond to document and prioritize data needs, including scoping not-yet-documented requirements (e.g. Research Team).&lt;/li&gt;&lt;li&gt;Coordinate with other Data Product Owners within IDA as well as with DPA to ensure alignment on data architecture, governance and shared platform usage.&lt;/li&gt;&lt;li&gt;Organize and lead stand-ups, retrospectives, and review sessions with impacted stakeholders.&lt;/li&gt;&lt;li&gt;Create firmwide transparency on vendor data sourcing, licensing terms, lineage and quality, ensuring consumers understand and trust the data.&lt;/li&gt;&lt;li&gt;Partner with MDS / Procurement on vendor contract and licensing terms (incl. AI usage), and with the ODP Platform team on infrastructure and streaming architecture decisions.&lt;/li&gt;&lt;li&gt;Serve as business partner for ITA leadership and investment teams on all matters relating to vendor and market / research data.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;Strategic Alignment &amp; Communication&lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Maximize business value while protecting the squad’s autonomy and delivery flexibility.&lt;/li&gt;&lt;li&gt;Ensure transparent communication of timelines, dependencies, open decisions and risks (e.g. vendor contracts, streaming architecture) to all stakeholders.&lt;/li&gt;&lt;li&gt;Promote a culture of continuous improvement, excellence, collaboration, and agile maturity.&lt;/li&gt;&lt;li&gt;Work closely together with Chapter Leads by defining the set of necessary competences in the Squad.&lt;/li&gt;&lt;li&gt;Share fair and transparent feedback on the Squad members with their respective Chapter Lead.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What you bring &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Academic background in Data &amp; Technology, Finance, Business Administration, Economics or a related field, with a strong understanding of data-driven business strategies.&lt;/li&gt;&lt;li&gt;Several years of relevant experience in market / vendor data management, data product ownership or asset management.&lt;/li&gt;&lt;li&gt;Solid understanding of financial market data vendors and products (e.g. Bloomberg, Refinitiv/LSEG, FactSet, ICE, Moody’s, S&amp;P, ISS ESG, Markit, etc.) and their delivery mechanisms (native delta-sharing, API, SFTP, etc.).&lt;/li&gt;&lt;li&gt;Familiarity with vendor contract and licensing considerations (usage rights, redistribution, entitlements) and ability to partner with Legal / Procurement.&lt;/li&gt;&lt;li&gt;Knowledge of data governance, data lineage, data quality, and cataloguing frameworks, ideally including Databricks Unity Catalog.&lt;/li&gt;&lt;li&gt;Experience with JIRA, agile delivery and data product lifecycle management; strong facilitation skills for agile ceremonies and stakeholder workshops.&lt;/li&gt;&lt;li&gt;Ability to define and manage a multi-wave product vision, roadmap and backlog, and to translate complex, cross-team data requirements into clear, actionable user stories.&lt;/li&gt;&lt;li&gt;Strong prioritization, value-delivery and stakeholder-alignment skills across a broad set of investment teams and vendors.&lt;/li&gt;&lt;li&gt;Excellent interpersonal, communication and presentation skills, with the ability to build trustful relationships with squad members, Chapter Leads, investment stakeholders and vendors.&lt;/li&gt;&lt;li&gt;International mentality with a strong interest to collaborate across locations and regions in a global organization.&lt;/li&gt;&lt;li&gt;Fluency in English both written and spoken, with additional languages considered an advantage.&lt;/li&gt;&lt;li&gt;Detail-oriented with strong organizational skills, capable of managing multiple vendor onboarding streams and deadlines in parallel.&lt;/li&gt;&lt;li&gt;Demonstrated initiative to take on new challenges and drive change, continuously improving data sourcing and governance practices.&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;What we offer&lt;/strong&gt;&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;ul&gt;&lt;li&gt;We empower our employees by ensuring flexible work arrangements that maintain a balance between performance, productivity, career development and personal priorities (e.g., hybrid model/ flexible working hours)&lt;/li&gt;&lt;li&gt;Securing your future: Access to company pension/savings plans&lt;/li&gt;&lt;li&gt;Shared success: Company share purchasing plan&lt;/li&gt;&lt;li&gt;Support for what matters: Mental health and wellbeing programs&lt;/li&gt;&lt;li&gt;Investments in your career: Career opportunities within the entire Allianz Group&lt;/li&gt;&lt;li&gt;Investments in your skills:  Comprehensive learning and development offerings, including certifications and professional qualifications&lt;/li&gt;&lt;li&gt;Volunteering time&lt;/li&gt;&lt;li&gt;… and so much more!&lt;/li&gt;&lt;/ul&gt;&lt;p&gt; &lt;/p&gt; &lt;p&gt;&lt;strong&gt;About Allianz Global Investors&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Allianz Global Investors is a leading active asset manager, managing assets for individuals, families, and institutions worldwide. Our shared goal to shape a future of opportunity for our clients is foundational to our culture and our values. We look to attract, and actively nurture, individuals with the drive to achieve excellence at every stage of the investment experience. &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;We believe an inclusive culture is key to a flourishing workforce. Not only do we celebrate the broad range of experiences, backgrounds, and attributes that our workforce brings, but we support our people to live and work in a way that promotes their own wellbeing.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Allianz Group is one of the most trusted insurance and asset management companies in the world. Caring for our employees, their ambitions, dreams and challenges is what makes us a unique employer.  &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;We are united by a shared commitment: to put our clients first and at the centre of everything we do. Their needs inspire our thinking and guide our actions.  &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Together, we can build an environment where everyone feels empowered and confident to explore, grow and shape a better future – for our clients and for the world around us. At Allianz, we stand for unity: we believe that a united world is a more prosperous world, and we are dedicated to consistently advocating for equal opportunities for all. The foundation for this is our inclusive workplace, where people and performance both matter, and where integrity, fairness, inclusion and trust are at the heart of our culture.  &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;We therefore welcome applications regardless of ethnicity or cultural background, age, gender, nationality, religion, social class, disability or sexual orientation, or any other characteristics protected under applicable local laws and regulations. &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;If you feel inspired to promote the active asset management experience, this is the place for you. Join our international, technology-enabled, and agile environment. Simply upload your CV in English to apply for this position.  If you need support to navigate our websites or at any stage during your application, please send an email with your request to &lt;a href=\"mailto:recruiting@allianzgi.com\" target=\"_blank\" rel=\"noopener\"&gt;recruiting@allianzgi.com&lt;/a&gt;. &lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;To Recruitment Agencies&lt;/strong&gt;:&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Allianz Global Investors has an in-house recruitment team that sources great candidates directly. Therefore, Allianz Global Investors does not accept unsolicited resumes from agency or search firm recruiters.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;When we do work with recruitment agencies, that engagement is formalized by a contract. Fees will only be paid when there is a contract in place.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Without a contract in place, we will not accept invoices on unsolicited resumes, even if the candidate was ultimately employed by Allianz Global Investors.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Finally, please do not contact hiring managers directly.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;Join us. &lt;strong&gt;Let’s care for tomorrow.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt; &lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;How to Apply:&lt;/strong&gt; Applying is quick and easy. Simply upload your CV, complete your personal details, confirm your consent for AI support in the “Additional Information” section, and submit your application.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;To support our recruiters, we use Fit Score—an AI‑powered tool that highlights how closely your profile aligns with the role. This helps us review applications more efficiently and focus on what matters most: your skills and experience.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;Good to know:&lt;/strong&gt; The Fit Score is a support tool only. At Allianz, technology never replaces human judgment. Every application is carefully reviewed by our recruiting teams, ensuring a fair, thoughtful, and personal hiring process.&lt;/p&gt;&lt;p&gt; &lt;/p&gt;&lt;p&gt;108904 | Data &amp; AI | Professional | n.a. | Allianz Global Investors | Full-Time | Permanent&lt;/p&gt;","title":"Data Product Owner (f/m/d) - Vendor Market Data","datePosted":"2026-10-29","@context":"http://schema.org","occupationalCategory":"Data & AI","directApply":false}</script></head><body></body></html>
