name: Daily HK Jobs Scrape

on:
  schedule:
    # 02:00 HKT (UTC+8) = 18:00 UTC on the previous UTC date.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      company:
        description: "Run only this company slug (leave blank for all)"
        required: false
        default: ""
      profile:
        description: "hosted = full nightly run; enrich_only = restore, enrich, publish (no scrape); repair = restore, deterministic salary repair, publish (no scrape, no model calls)"
        required: false
        default: hosted
        type: choice
        options:
          - hosted
          - enrich_only
          - repair

permissions:
  contents: read
  actions: read

# One run at a time. A manual workflow_dispatch overlapping the scheduled run
# (as happened 2026-08-13) doubles the request volume against every source in
# the same window, which is exactly the kind of burst that gets an IP rate
# limited or Cloudflare-challenged. Queue rather than cancel — a cancelled
# scrape is a lost day of data for no benefit.
concurrency:
  group: daily-hk-jobs-scrape
  cancel-in-progress: false

jobs:
  daily-run:
    name: Daily Run
    runs-on: ubuntu-latest
    # Recent runs take 27-67 minutes. 300 is headroom, not the expected time —
    # it exists so a hung Playwright call (network_idle=True is the known way
    # to trigger this; see the adapters' own docstrings) fails the run instead
    # of silently burning CI minutes for up to GitHub's own 360-minute default.
    # 2026-08-14's run is the reason this is 300 and not 120: JobsDB threw
    # Cloudflare Turnstile challenges at ~29 of its 65 companies that day,
    # each retry/solve cycle costing minutes instead of seconds, and the old
    # 120-minute cap killed the job mid-scrape — before descriptions, DeepSeek
    # enrichment, or the Railway publish ever ran, so the whole day's run
    # contributed nothing (silently safe, but a lost day of data).
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # A ceiling on Roles enriched per run, not a budget. It becomes a starvation
      # risk whenever the backlog exceeds it, because the enricher selects
      # `ORDER BY j.fetched_at DESC LIMIT <this>` — newest first. At 300, a night
      # that brought in 300+ un-enriched Roles pushed the older ones further down
      # every subsequent night, and they were never reached again. 569 Roles on
      # production had no enrichment row at all, so no `description_summary`, and
      # the read path used to fall back to publishing the employer's own text.
      #
      # 1200 clears that 569 backlog in one run and still leaves room for a
      # night's intake (recent runs: 372-806 Roles). The bill is bounded by
      # construction, not by hope: LIMIT caps rows at 1200, enrichers/deepseek.py
      # retries at most 3 times per Role and then gives up, and one Role is one
      # call — so at the observed $0.00193/Role this phase cannot exceed
      # 1200 x 3 x $0.00193 = $6.95, and costs ~$1.10-2.30 in practice.
      #
      # Safe to drop back to 300 once the backlog is clear, but leaving headroom
      # above the nightly intake is what stops the starvation recurring.
      DEEPSEEK_DAILY_ENRICH_LIMIT: "1200"
      PIPELINE_SYNC_TOKEN: ${{ secrets.PIPELINE_SYNC_TOKEN }}
      PIPELINE_DATABASE_SYNC_URL: https://finex-careers.up.railway.app/api/admin/pipeline/database
      PIPELINE_OPERATIONS_URL: https://finex-careers.up.railway.app/api/admin/pipeline/operations
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAILS: amine@finexclub.org,mohamedaminechahid@gmail.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright/Scrapling browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      # 2026-08-12's run is the reason this step exists: `pip install` above
      # gets the playwright/patchright/scrapling PYTHON PACKAGES, but the
      # jobsdb and indeed adapters both launch a real headless browser
      # (scrapling.fetchers.StealthyFetcher, which uses patchright — see
      # hk_jobs/adapters/jobsdb.py and indeed.py's own docstrings) and that
      # needs its browser BINARY downloaded separately. Without this step
      # every fresh runner had zero cached browsers, so chromium.launch()
      # raised Playwright's own generic `Error` immediately, on every attempt,
      # for every jobsdb/indeed company — 100% failure, silently: the adapters
      # catch it and return partial/zero results rather than crashing the run
      # (by design, so one broken source can't take down the other 247), so
      # the workflow itself reported success while two whole sources returned
      # nothing every single day.
      #
      # `scrapling install` (not a raw `playwright install chromium`) is
      # Scrapling's own documented setup command — it installs exactly the
      # browser + OS-level dependencies (`playwright install-deps`) its
      # fetchers need, which is the one authority on the actual requirement
      # rather than us guessing at it from outside.
      - name: Install Scrapling browser dependencies
        run: scrapling install

      - name: Execute canonical Daily Run
        id: daily_run
        env:
          COMPANY: ${{ github.event.inputs.company }}
          SEND_RESULT_EMAIL: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # A scheduled run is always the full nightly pipeline; only a manual
          # dispatch may narrow it to enrich_only.
          PROFILE: ${{ github.event_name == 'schedule' && 'hosted' || inputs.profile }}
        run: |
          ARGS=(
            --profile "${PROFILE:-hosted}"
            --run-id "$GITHUB_RUN_ID"
            --record data/daily-run.json
            --database data/jobs.db
            --export data/jobs.jsonl
            --report-railway
          )
          if [[ -n "$COMPANY" ]]; then
            ARGS+=(--company "$COMPANY")
          fi
          if [[ "$SEND_RESULT_EMAIL" == "1" ]]; then
            ARGS+=(--email)
          fi
          python -m hk_jobs.daily_run "${ARGS[@]}"

      - name: Upload authoritative Daily Run Record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-${{ github.run_id }}
          path: data/daily-run.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload JSONL snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ github.run_id }}
          path: data/jobs.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Upload database for incremental restore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-${{ github.run_id }}
          path: data/jobs.db
          retention-days: 7
          if-no-files-found: warn
