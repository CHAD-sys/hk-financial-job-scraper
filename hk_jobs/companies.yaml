##############################################################################
#  ⚠  UNVERIFIED ATS ASSIGNMENTS — READ BEFORE RUNNING  ⚠
#
#  Every `adapter:` value in this file is an educated guess based on
#  company size, industry norms, and ATS market-share data. NONE of them
#  have been verified against the live careers pages.
#
#  HOW TO VERIFY A SINGLE COMPANY (takes ~2 minutes per company):
#    1. Open the company's careers page in Chrome.
#    2. Open DevTools  →  Network tab  →  tick "XHR / Fetch".
#    3. Type something in the job-search box, or scroll the listing.
#    4. Look at the URLs that appear in the Network panel:
#         • contains "myworkdayjobs.com"  →  adapter: workday
#         • contains "eightfold.ai"       →  adapter: eightfold
#         • contains "successfactors"     →  adapter: successfactors  (not yet built)
#         • contains "taleo.net"          →  adapter: jobsdb  (hostile, use fallback)
#         • contains "icims.com"          →  adapter: jobsdb  (hostile, use fallback)
#    5. For Workday: the URL path is
#         /wday/cxs/{tenant}/{site}/jobs  →  copy tenant and site here.
#    6. For Eightfold: the subdomain is
#         {tenant}.eightfold.ai  →  copy tenant here.
#         The "domain" field is the company's own internet domain.
#    7. If nothing appears in the Network tab, the page is server-rendered;
#       try navigating to a job detail page and look for an API call there.
#
#  Set `enabled: false` to skip a company without removing its config.
#  After you verify a company, please remove the "# UNVERIFIED" comment
#  on its adapter line so we can track progress.
##############################################################################

# Schema for each entry:
#   name    : human-readable company name
#   slug    : URL-safe lowercase identifier used as company_slug in Job objects
#   adapter : one of: workday | eightfold | jobsdb
#   enabled : true | false
#   config  : adapter-specific keys (see HOW TO VERIFY above)
#     workday   → tenant (str), site (str), wd (str, default "wd3"),
#                 location_filter (str, default "Hong Kong")
#     eightfold → tenant (str), domain (str),
#                 location_filter (str, default "Hong Kong")
#     jobsdb    → jobsdb_slug (str), max_pages (int, default 5)

