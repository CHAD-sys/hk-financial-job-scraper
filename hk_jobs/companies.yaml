##############################################################################
#  ⚠  UNVERIFIED ATS ASSIGNMENTS — READ BEFORE RUNNING  ⚠
#
#  Every `adapter:` value and every config value marked "# TODO" below is
#  an educated guess. NONE have been verified against live careers pages.
#
#  HOW TO VERIFY A SINGLE COMPANY (takes ~2 minutes per company):
#    1. Open the company's careers page in Chrome.
#    2. DevTools  →  Network tab  →  tick "Fetch/XHR".
#    3. Type in the job-search box or scroll the listing.
#    4. Look at the request URLs that appear:
#         • contains "myworkdayjobs.com"  →  adapter: workday
#             URL path: /wday/cxs/{tenant}/{site}/jobs  →  note tenant + site
#             Subdomain prefix (wd1/wd3/wd5) is the `wd:` value
#         • contains "eightfold.ai"       →  adapter: eightfold
#             Subdomain: {tenant}.eightfold.ai  →  note tenant
#             "domain" query param in the XHR call  →  note domain
#         • contains "taleo.net"          →  adapter: jobsdb  (Taleo is hostile)
#         • contains "icims.com"          →  adapter: jobsdb  (iCIMS is hostile)
#         • no ATS XHR found             →  adapter: jobsdb  (fallback)
#    5. For the JobsDB slug: visit hk.jobsdb.com, search the company,
#       click their profile. The slug is the part before "-jobs" in the URL,
#       e.g. hk.jobsdb.com/bank-of-china-hong-kong-jobs → "bank-of-china-hong-kong".
#
#  Remove the "# TODO verify" comment once a value has been confirmed.
#  Set `enabled: false` to pause a company without deleting its config.
##############################################################################

# Schema:
#   name    : human-readable company name
#   slug    : kebab-case identifier — used as company_slug in Job objects
#   adapter : workday | eightfold | jobsdb
#   enabled : true | false
#   config  :
#     workday   → tenant (str, TODO), site (str, TODO), wd (str, default "wd3"),
#                 location_filter (str, default "Hong Kong")
#     eightfold → tenant (str, TODO), domain (str, TODO),
#                 location_filter (str, default "Hong Kong")
#     jobsdb    → jobsdb_slug (str, TODO), max_pages (int, default 5),
#                 proxy (str, optional) — residential proxy URL to bypass Cloudflare.
#                 Format: "http://user:pass@host:port"
#                 Services: Bright Data (brightdata.com), Oxylabs, Smartproxy, IPRoyal.
#                 Omit if you have direct access; required for most CI/datacenter IPs.
#                 ⚠ Do NOT commit real credentials — use an env var or secrets manager:
#                   proxy: !ENV HK_JOBS_PROXY   (requires a custom YAML loader)

companies:

  # ── Banking ──────────────────────────────────────────────────────────────
  # Source: https://www.hsbc.com.hk, https://www.bochk.com, etc.

  - name: HSBC Hong Kong
    slug: hsbc-hk
    adapter: eightfold           # hsbc.eightfold.ai confirmed by user
    enabled: true
    config:
      tenant: hsbc               # TODO verify: open hsbc.eightfold.ai in DevTools
      domain: hsbc.com           # TODO verify: check "domain" query param in XHR

  - name: Bank of China (Hong Kong)
    slug: bochk
    adapter: jobsdb              # direct ATS unknown; JobsDB fallback
    enabled: true
    config:
      jobsdb_slug: bank-of-china-hong-kong   # TODO verify JobsDB slug
      # proxy: "http://user:pass@residential-proxy.example.com:8080"  # uncomment + fill in

  - name: Standard Chartered Bank (HK)
    slug: standard-chartered-hk
    adapter: jobsdb              # switched from workday: 422 on /wday/cxs/standardchartered/External/jobs
    enabled: true
    config:
      jobsdb_slug: Standard-Chartered   # verified slug format

  - name: Hang Seng Bank
    slug: hang-seng-bank
    adapter: eightfold
    enabled: false               # DISABLED: Hang Seng jobs are already included in the HSBC HK result.
                                 # Both share hsbc.eightfold.ai, but domain=hangseng.com returns 404 —
                                 # Hang Seng jobs appear to be registered under hsbc.com in Eightfold.
                                 # Re-enable only if you need Hang Seng results separated from HSBC.
    config:
      tenant: hsbc
      domain: hangseng.com

  - name: DBS Bank (Hong Kong)
    slug: dbs-hk
    adapter: jobsdb              # DBS uses Taleo (hostile); JobsDB fallback hk.jobsdb.com/DBS-Bank-jobs
    enabled: true
