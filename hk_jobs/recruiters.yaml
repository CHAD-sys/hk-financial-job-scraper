##############################################################################
#  Secret Market — LinkedIn recruiter-post watchlist  (LP-1, bootstrap)
#
#  Every entry below is a REAL, verified-to-exist LinkedIn profile or company
#  page. Sourcing per entry is noted under `added_by`:
#    search — surfaced by the LP-0 harvestapi/linkedin-post-search discovery
#              test (2026-07-19), authoring a genuine job-relevant post
#    roster — sourced from the recruiting agency's own public "meet the team"
#              page (Hays / Selby Jennings / Morgan McKinley / Robert Walters /
#              Pure Search), used as the LP-0 profile-posts test fixture
#    manual — pending: boss-assigned manual enumeration, not yet supplied
#
#  `enabled: true` = active in the LP-4 pilot watchlist. All 28 candidates
#  found so far are active by explicit instruction (2026-07-19) — the caveats
#  in each entry's `notes` (stale post history, zero yield in the LP-0 test,
#  Selby Jennings concentration, unverified individual) are kept as context
#  for reading the pilot's results, not as a reason anything is switched off.
#
#  Nothing here has been polled on a schedule yet — LP-2 builds that. This
#  file only exists so LP-2's fetcher has real targets on day one.
##############################################################################

# Schema:
#   name        : recruiter's display name, or agency name for agency_page tier
#   slug        : kebab-case identifier. Used to build company_slug for jobs
#                 sourced from this recruiter when the post names no employer:
#                 "confidential-{slug}" (see Job.schema decision on confidential
#                 employers, PLAN_LINKEDIN_POSTS.md decision #7).
#   tier        : agency_recruiter | independent | agency_page
#                 (per PLAN_LINKEDIN_POSTS.md decision #3 — no in-house TA)
#   agency      : agency name, or null for independent headhunters
#   profile_url : LinkedIn profile or company page URL (public, no login needed)
#   enabled     : true | false — true polls this profile in the LP-4 pilot
#   added_by    : search | roster | manual
